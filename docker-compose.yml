version:  '3.8'
services:
  backend:
    build:
      context: ./server
    ports:
      -  "8080:8080"
    networks:
      -  game-network
  ai-agent:
    build:
      context: ./ai-agent
    ports:
      -  "5000:5000"
    networks:
      -  game-network
  frontend:
    
    build:
      context: ./tanks_client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./tanks_client:/usr/share/nginx/html
      - ./tanks_client/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - game-network
networks:
  game-network:
    driver:  bridge

